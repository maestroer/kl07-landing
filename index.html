<html lang="ru" data-accent="neutral">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KL07 — платформа расчёта экономики проекта</title>
    <meta name="description" content="KL07 — платформа для расчёта рентабельности, инвойсинга и учёта подписок для фрилансеров, команд и агентств. AI-архитектор: от идеи до сметы." />
    <meta property="og:title" content="KL07 — платформа расчёта экономики проекта" />
    <meta property="og:description" content="Дашборд, калькуляторы, инвойсы, сабтрекер и AI-архитектор в одном флоу." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='30' fill='%23171717'/><text y='68' x='50' text-anchor='middle' font-size='44' font-family='sans-serif' font-weight='700' fill='white'>07</text></svg>" />
    <script>
      // Тема ставится до первой отрисовки, чтобы страница не мигала светлым у тех, кто выбрал тёмную.
      (function () {
        try {
          var saved = localStorage.getItem('kl07.theme')
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
