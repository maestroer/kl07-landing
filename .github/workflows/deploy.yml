name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Есть public/CNAME — значит сайт на своём домене и живёт в корне.
      # Нет — значит отдаётся с github.io/<repo>/ и собирать надо под подпапку.
      - name: base url
        run: |
          if [ -f public/CNAME ]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi

      - run: npm run build
        env:
          VITE_BASE: ${{ env.VITE_BASE }}
          VITE_WAITLIST_ENDPOINT: ${{ vars.VITE_WAITLIST_ENDPOINT }}

      # GitHub Pages не умеет SPA-fallback. 404.html ловит любой неизвестный путь,
      # но отдаёт его со статусом 404 — плохо для шеринга и поисковиков. Поэтому
      # известные роуты кладём реальными файлами, они отвечают 200.
      - name: spa fallback
        run: |
          cp dist/index.html dist/404.html
          for route in invest b2b; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
